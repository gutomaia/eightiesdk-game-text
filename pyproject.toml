[tool.poetry]
name = "eightiesdk-text"
version = "0.1.0"
description = "Eighties SDK text: fonts a game brings itself, as glyph grids a console crust can expand into any colour depth."
authors = ["Guto Maia <guto@guto.net>"]
license = "BSD-3-Clause"
readme = "README.md"
packages = [{ include = "eightiesdk_text" }]

[tool.poetry.dependencies]
python = "^3.12"
# render.py imports PIL to draw a glyph from a typeface. It was
# declared NOWHERE — this file had no runtime dependencies at all
# — and the suite was green because Pillow happened to be in a
# hand-assembled venv and the one example that touches the render
# path is wrapped in skipUnless(PILLOW). A fresh install of this
# package raised ImportError the first time anyone drew a glyph.
pillow = "^12.3"

[tool.poetry.group.dev.dependencies]
black = "^25.1"
flake8 = "^7.3"
pytest = "^8.4"
bandit = "^1.9"

[tool.black]
line-length = 79
skip-string-normalization = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
