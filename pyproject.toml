[tool.poetry]
name = "eightiesdk-text"
version = "0.1.0"
description = "Eighties SDK text: fonts a game brings itself, as glyph grids a console crust can expand into any colour depth."
authors = ["Guto Maia <guto@guto.net>"]
license = "BSD-3-Clause"
readme = "README.md"
packages = [{ include = "eightiesdk_text" }]

[tool.poetry.dependencies]
python = "^3.12"

[tool.poetry.group.dev.dependencies]
black = "^25.1"
flake8 = "^7.3"
pytest = "^8.4"

[tool.black]
line-length = 79
skip-string-normalization = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
