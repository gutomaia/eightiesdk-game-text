name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install virtualenv
        run: pip install virtualenv
      - name: Build, test and code checks
        run: make
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
